  location_sharing:
    description: "User-controlled native geolocation. Uses the standard browser Geolocation API (navigator.geolocation) which proxies to the platform's native permission prompt — iOS Safari surfaces 'Allow Once / While Using App / Don't Allow', Android Chrome surfaces 'Allow this time / While visiting the site / Never allow'. No background tracking, no server-side storage of coordinates."
    modes:
      off: "Default. No location requested or used. App continues to operate against the hardcoded city ('Los Angeles')."
      once: "Single coordinate capture for the current page interaction (e.g. 'Use my location' on Near You This Week). After capture the preference auto-reverts to 'off' so the next visit does not silently re-request."
      while_using: "App may refresh coordinates each time the user opens a location-aware page in the foreground. No watchPosition tail — the moment the tab is hidden or closed, no further location is fetched."
    user_controls:
      surface: "Profile → Settings section. Single segmented control with three options (Off | Once | While Using)."
      copy: "Plain language: 'Off — never asks. Once — uses your location now, then forgets. While Using — refreshes when you open Near You.'"
      style: "Custom Svelte segmented control. NEVER use native <select> or browser radio inputs (per app spec: thematic, framework-based, consistently-styled elements)."
    consumers:
      home_near_you_this_week: "If mode is 'once' or 'while_using' and a fresh coordinate is available, the section header shows 'Near you this week — using your location'. If permission denied or coordinate stale (> 30 min for while_using), falls back to the hardcoded LA city filter."
      events_page_future: "Reserved — /events page may consume the same store to bias Ticketmaster queries by latlong. Out of scope for initial implementation."
    permission_handling:
      denied: "If the browser returns PERMISSION_DENIED, store sets mode back to 'off' and shows a toast: 'Location blocked. Re-enable in your browser settings to use this feature.'"
      unavailable: "If navigator.geolocation is undefined (very old browsers, insecure context), the segmented control is rendered disabled with a 'Not supported on this device' caption."
      timeout: "10-second timeout on getCurrentPosition. On timeout, show a toast and revert mode to 'off' for 'once', keep 'while_using' (will retry on next consumer call)."
    privacy:
      storage: "Latest coordinate held only in an in-memory Svelte writable + localStorage (last reading + timestamp). NEVER sent to the server in this MVP."
      no_logging: "Coordinates are not logged, not written to xp_transactions, not exposed in any API endpoint."
      native_prompt_only: "Relies on browser-native permission UI — Maxess does not show its own custom 'allow location?' modal; the segmented control IS the consent surface."
    store:
      path: "src/lib/stores/location.ts"
      shape: |
        type LocationMode = 'off' | 'once' | 'while_using';
        type StoredLocation = { lat: number; lon: number; accuracy: number; capturedAt: number };
        export const locationMode: Writable<LocationMode>;
        export const lastLocation: Writable<StoredLocation | null>;
        export function requestLocation(): Promise<StoredLocation | null>;
      localStorage_keys:
        - "maxess.locationMode (off | once | while_using)"
        - "maxess.lastLocation (JSON of StoredLocation)"
    accessibility:
      - "Segmented control buttons each have aria-pressed reflecting active mode"
      - "Toast announcements use the existing showToast helper"
      - "Disabled state when unavailable has aria-disabled + visible caption"
    test_coverage:
      - "Mode transitions: off → once → off (auto-revert after capture)"
      - "Mode transitions: off → while_using stays sticky across requests"
      - "Permission denied path reverts to off and toasts"
      - "SSR safety: store initializes to 'off' without touching navigator/localStorage"

