app_spec:
  name: "Maxxes MVP - Fan Ranking & Community Platform"
  version: "0.6.1-MVP"
  status: "Light theme, 4-tier system (General/Loyal/Superfan/Elite), Prisma 7.8 + @prisma/adapter-pg on PostgreSQL, 5-tab bottom nav, server-side data loading, deployed to Vercel, Apple Wallet attendance verification (unsigned-mode demo)"

  product_direction:
    description: "Maxxes is a fan ranking, rewards, and community platform for the live events industry. It connects ticketing history and music streaming behavior into a single verified fan profile — the Superfan Score — and uses that score to unlock tier-based rewards, presale access, and community standing."
    mvp_focus: "Four-screen interactive prototype with live data from Ticketmaster, Spotify, Last.fm, and Vercel PostgreSQL, deployed to Vercel"
    business_positioning: "Platform connecting fans with live events through verified engagement scoring"
    core_directive: "Wire real data sources end-to-end. Ticketmaster Discovery API is the primary event source. Spotify is the primary music intelligence source with Last.fm as fallback. User data lives in Vercel PostgreSQL via Prisma. Auth is deferred — this is a demo prototype using a hardcoded demo user (Alex Chen)."
    questions_answered:
      - "What is my Superfan Score and how do I improve it?"
      - "What tier am I and what rewards can I unlock?"
      - "How do I rank against other fans in my city?"
      - "What challenges can I complete to earn more XP?"
      - "Which events should I attend for maximum fan engagement?"

  mvp_boundary:
    version_target: "0.6.1 — currently shipping"
    must_build:
      - "Home screen with Momentum Score card, sparkline, upcoming events, ranking summary, community activity, and trending section"
      - "Events screen with filtering, search, and booking capabilities"
      - "Score screen — leaderboard, challenges, friend activity, XP breakdown, 14-day XP history sparkline. Navbar label: Score. Route: /score"
      - "Access screen — passes, featured offers, top artist/team progress to next tier. Navbar label: Access. Route: /access"
      - "Profile screen with XP breakdown, per-artist tiers, and settings"
      - "Event detail screen (/events/[id]) with Ticketmaster fallback for tm_* ids"
      - "Artist detail screen (/artist/[id])"
      - "Pass detail screen (/passes/[id])"
      - "Persistent 5-tab bottom navigation (Home, Events, Score, Access, Profile)"
      - "Server-side data layer — PostgreSQL via Prisma + Ticketmaster + Spotify/Last.fm in +page.server.ts load functions"
      - "Server-side XP/tier classification driven by xp_transactions ledger and Prisma tier enum"
      - "All animations and state transitions as specified"
      - "Mobile-responsive design with touch-friendly interactions"
      - "Deployed to Vercel with a public URL"

    what_mvp_is_not:
      - "A static slide deck or PDF mockup"
      - "A prototype requiring live presenter explanation"
      - "An app that only works locally"
      - "A production platform with user authentication (auth is deferred to roadmap)"
      - "An Apple Music integration (excluded by product decision)"

  technology_stack:
    frontend_framework: "SvelteKit 2.15+ with Svelte 5.20+ and TypeScript"
    styling: "Plain CSS with design tokens in src/lib/styles/tokens.css (no Tailwind in current build)"
    build_tool: "Vite 6.0+"
    package_manager: "npm"
    deployment: "Vercel with @sveltejs/adapter-vercel 6.3+ (server routes required for API proxying and database access)"
    icons: "lucide-svelte 0.468+"
    orm: "Prisma 7.8 with @prisma/adapter-pg (driver adapter) on top of node-postgres (pg 8.21)"
    utilities:
      - "zod 3.24 for validation"
    testing:
      - "vitest 4.1 for unit tests"
      - "@playwright/test for E2E testing (planned)"

  visual_design:
    theme: "Light theme (app-wide)"
    color_palette:
      primary_orange: "#FF5C00"
      bg_primary: "#F8F8FA"
      bg_card: "#FFFFFF"
      bg_card_elevated: "#F5F5F7"
      bg_input: "#F2F2F7"
      text_primary: "#000000"
      text_secondary: "#8E8E93"
      text_tertiary: "#C7C7CC"
      border_gray: "#E5E5EA"
      border_subtle: "#F0F0F0"
      success_green: "#34D399"
      error_red: "#EF4444"
      gold: "#FFD700"
      deep_navy: "#2667FF"
      deeper_indigo: "#3B28CC"

    typography:
      system: "System font stack with fallbacks (-apple-system, BlinkMacSystemFont, SF Pro Display)"
      hierarchy: "Consistent heading and body text sizing"

    layout_rules:
      page_padding: "16px horizontal (never touch screen edges)"
      card_border_radius: "14-20px (18-20px for hero cards)"
      card_borders: "1px solid #E5E5EA (inactive), 1.5-2px solid #FF5C00 (active)"
      card_gaps: "8-10px vertical, 16-20px between sections"
      bottom_nav_height: "70px content + safe area inset"
      touch_targets: "minimum 44×44px for all tappable elements"

  data_sources:
    integration_strategy: "All real data. Ticketmaster for events, Spotify + Last.fm for music intelligence, PostgreSQL for user/fan data. No mock data in production."

    source_a_ticketmaster:
      owner: "Luke"
      description: "Primary event source — live queries to Ticketmaster Discovery API (DMA 324)"
      type: "Live API integration"
      api_key_status: "Pending — will be obtained from developer.ticketmaster.com"
      rate_limits: "5,000 requests/day, 5 requests/second"
      base_url: "https://app.ticketmaster.com/discovery/v2"
      client_class: "src/lib/api/ticketmaster.ts (extends BaseApiClient)"
      cache_strategy: "Event search results cached 5 min, individual events cached 15 min"
      fields_per_event: 36
      stats:
        total_events: 20
        unique_venues: 8
        events_on_sale: 16
        events_with_presale: 15
        events_with_spotify_url: 16
        events_with_addon_products: 12
        genre_coverage: ["Pop", "Hip-Hop/Rap", "Rock", "Metal", "Latin", "Country", "Classical"]
      venues:
        - "Crypto.com Arena"
        - "BMO Stadium"
        - "Greek Theatre"
        - "Hollywood Pantages Theatre"
        - "Dodger Stadium"
        - "The Wiltern"
        - "Walt Disney Concert Hall"
        - "Orpheum Theatre"
      event_inventory:
        - { name: "Ariana Grande — The Eternal Sunshine Tour", date: "Jun 13–14, 2026", genre: "Pop", venue: "Crypto.com Arena", status: "On sale", presale: true, featured: true }
        - { name: "Don Toliver: Octane Tour", date: "Jun 28–29, 2026", genre: "Hip-Hop/Rap", venue: "Crypto.com Arena", status: "On sale", presale: true, featured: true }
        - { name: "Joshua Bell w/ Jeremy Denk", date: "Jun 3, 2026", genre: "Classical", venue: "Walt Disney Concert Hall", status: "On sale", presale: false }
        - { name: "Fuerza Regida: This Is Our Dream Stadium Tour", date: "Jul 18, 2026", genre: "Latin", venue: "Dodger Stadium", status: "On sale", presale: true }
        - { name: "Belicofest", date: "Jul 12, 2026", genre: "Latin", venue: "BMO Stadium", status: "On sale", presale: true }
        - { name: "TRAIN — Drops of Jupiter: 25 Years", date: "Aug 24, 2026", genre: "Rock", venue: "Greek Theatre", status: "On sale", presale: true }
        - { name: "Avenged Sevenfold, Good Charlotte", date: "Aug 30, 2026", genre: "Rock", venue: "BMO Stadium", status: "On sale", presale: true }
        - { name: "Carin Leon — De Sonora Para El Mundo Tour", date: "Sep 20, 2026", genre: "Latin", venue: "BMO Stadium", status: "On sale", presale: true }
        - { name: "Iron Maiden: Run For Your Lives World Tour", date: "Sep 25–27, 2026", genre: "Metal", venue: "BMO Stadium", status: "On sale", presale: true }
        - { name: "Billy Strings", date: "Sep 25, 2026", genre: "Country", venue: "Orpheum Theatre", status: "Off sale", presale: false }
        - { name: "WEEZER: The Gathering", date: "Oct 24, 2026", genre: "Rock", venue: "Crypto.com Arena", status: "On sale", presale: true }
        - { name: "Kacey Musgraves", date: "Oct 18–19, 2026", genre: "Country", venue: "Crypto.com Arena", status: "On sale", presale: true }
        - { name: "Bonnie Raitt: Live 2026", date: "Oct 20–21, 2026", genre: "Rock", venue: "Hollywood Pantages Theatre", status: "On sale", presale: true }
        - { name: "for KING & COUNTRY", date: "Oct 9, 2026", genre: "Pop", venue: "Greek Theatre", status: "Off sale", presale: true }
        - { name: "The Rocky Horror Picture Show", date: "Oct 26, 2026", genre: "Music/Film", venue: "The Wiltern", status: "Off sale", presale: true }

    source_b_spotify:
      description: "Primary music intelligence — artist data, search, track metadata, relevance scoring"
      type: "Live API integration"
      auth_flow: "Client Credentials (no user OAuth needed for demo — artist data, search, tracks)"
      note: "User-specific endpoints (top artists, recently played) require Authorization Code + PKCE flow, deferred until auth is implemented. User listening data simulated via seed data for demo."
      rate_limits: "1,000 requests/hour per user"
      base_url: "https://api.spotify.com/v1"
      client_class: "src/lib/api/spotify.ts (extends BaseApiClient)"
      capabilities:
        - "Artist search and metadata"
        - "Track metadata and preview URLs"
        - "Related artists for recommendation"
        - "Artist top tracks"
      fallback: "Last.fm (see source_c)"

    source_c_lastfm:
      description: "Secondary music intelligence — fallback when Spotify unavailable, scrobble history, artist tags, similar artists"
      type: "Live API integration"
      auth_flow: "API key only (no OAuth)"
      rate_limits: "5 requests/second"
      base_url: "https://ws.audioscrobbler.com/2.0"
      client_class: "src/lib/api/lastfm.ts (extends BaseApiClient)"
      capabilities:
        - "User top artists (if Last.fm username stored)"
        - "User top tracks and scrobble counts"
        - "Artist info and tags"
        - "Similar artists for recommendation"
      role: "Fallback when Spotify rate-limited or missing data. Also provides deeper scrobble history and artist tags not available from Spotify Client Credentials."

    source_d_postgresql:
      description: "All user/fan data — profiles, XP totals + ledger, leaderboards (per period × per city), challenges + per-user progress, passes, friend activity, recent activity"
      type: "PostgreSQL via Prisma 7.8 ORM with @prisma/adapter-pg driver adapter on node-postgres pool"
      schema: "prisma/schema.prisma"
      client_setup: "src/lib/server/database.ts — singleton PrismaClient with PrismaPg adapter, connection string from env.DATABASE_URL with fallback to local prisma dev server"
      connection_strategy: "pg.Pool wrapped by PrismaPg adapter. dev: query/error/warn logs. prod: error logs only."
      local_dev:
        server: "prisma dev (postgres://postgres:postgres@localhost:51214/template1?sslmode=disable)"
        seed: "npm run db:seed → tsx prisma/seed.ts (uses same pg + PrismaPg adapter pattern as runtime)"
        prisma_config: "prisma.config.ts"
      query_functions:
        path: "src/lib/server/database.ts"
        exports:
          - "getUserByFanId(fanId) — user + event_interactions + challenge_progress"
          - "getUserByEmail(email)"
          - "createUser({ email, name, city, fan_id? })"
          - "updateUserProfile(fanId, partial)"
          - "getLeaderboard(period, city?)"
          - "getAllLeaderboardEntries() — all periods, up to 300 rows"
          - "getFriendUserIds(fanId) — resolves friend_name strings to user.id list"
          - "getUserEvents(fanId)"
          - "getUpcomingEvents(category?, city?, limit) — falls back when Ticketmaster unavailable"
          - "searchEvents(query, category?, limit)"
          - "getUserChallenges(fanId, completed?)"
          - "addXpTransaction(fanId, { amount, source, reference?, description? }) — appends ledger row, updates xp_total, recomputes current_tier via calculateTier()"
          - "toggleEventBookmark(fanId, eventId)"
          - "updateChallengeProgress(fanId, challengeId, progress, completed?)"
          - "getFriendActivity(fanId, limit)"
          - "getRecentActivity(fanId, limit)"
          - "getXpHistory(fanId, days) — daily totals, gaps filled with 0"
          - "getXpBreakdown(fanId) — sum of xp_transactions grouped by source"
          - "getUserPasses(fanId)"
          - "getFeaturedOffers(limit) — passes where status=AVAILABLE and user_id=null"
          - "getPassByPassId(passId)"
          - "disconnect()"
        helpers:
          - "calculateTier(xp) — ELITE ≥5000, SUPERFAN ≥2500, LOYAL ≥1000, else GENERAL (matches prisma/seed.ts tierFromXp)"
      transforms:
        path: "src/lib/server/transforms.ts"
        purpose: "Convert Prisma rows to domain types (Fan, LeaderboardEntry, Challenge, Pass, FriendActivity, RecentActivity) for UI consumption"
        notes:
          - "tierDisplayName() maps Prisma tier enum → 'General' | 'Loyal' | 'Superfan' | 'Elite'"
          - "transformPass maps Prisma PassStatus → UI 'active' | 'starts_soon' | 'waiting'"
          - "transformLeaderboardEntry stamps is_me / is_friend per current viewer + derives deterministic delta from hash(name + period)"
          - "getTierPerks() returns static perk strings per tier (Fan/Loyal/Superfan/Elite)"
      models:
        User:
          fields: ["id (cuid)", "fan_id @unique", "email?", "name", "avatar_initials", "city", "member_since", "created_at", "updated_at", "xp_total", "current_tier (Tier enum)", "streak_days", "rank?", "percentile?", "top_artist?", "top_venue?", "events_attended", "spotify_id?", "apple_music_id?", "discord_id?", "lastfm_username?"]
          relations: ["event_interactions → UserEvent", "challenge_progress → UserChallenge", "xp_transactions → XpTransaction", "friend_activities → FriendActivity", "recent_activities → RecentActivity"]
          table: "users"
        Event:
          fields: ["id (cuid)", "event_id @unique", "title", "subtitle?", "artist?", "venue", "city", "date", "category (EventCategory)", "image_url?", "status?", "trending", "featured", "created_at"]
          relations: ["user_events → UserEvent"]
          table: "events"
        UserEvent:
          fields: ["id (cuid)", "user_id", "event_id", "bookmarked", "notify_me", "attended", "created_at"]
          constraints: ["@@unique([user_id, event_id])"]
          table: "user_events"
        Challenge:
          fields: ["id (cuid)", "challenge_id @unique", "title", "description?", "category", "xp_reward", "difficulty (default Medium)", "tasks (Json — array of {id, text, completed})", "progress_target (default 100)", "active", "created_at"]
          table: "challenges"
        UserChallenge:
          fields: ["id (cuid)", "user_id", "challenge_id", "completed", "progress (0-100)", "tasks_completed (Json — completed task ids)", "completed_at?", "created_at"]
          constraints: ["@@unique([user_id, challenge_id])"]
          table: "user_challenges"
        XpTransaction:
          fields: ["id (cuid)", "user_id", "amount", "source", "reference?", "description?", "created_at"]
          purpose: "Append-only XP ledger — feeds getXpBreakdown(), getXpHistory(), and xp_total recomputation"
          table: "xp_transactions"
        Pass:
          fields: ["id (cuid)", "pass_id @unique", "user_id?", "title", "description?", "tier (Tier)", "status (PassStatus, default AVAILABLE)", "valid_until?", "created_at", "claimed_at?", "apple_wallet_serial? @unique", "wallet_added_at?", "pass_kind (PassKind, default PERK)", "event_id?"]
          relations: ["attendance_verifications → AttendanceVerification"]
          notes: "user_id is null for featured/available offers; populated when claimed. event_id links a TICKET-kind pass to its Event for attendance scoring."
          table: "passes"
        AttendanceVerification:
          fields: ["id (cuid)", "user_id", "event_id", "pass_id?", "method (VerificationMethod)", "confidence (0-100)", "xp_awarded", "scanner_ip?", "metadata (Json)?", "verified_at"]
          constraints: ["@@unique([user_id, event_id, method])", "@@index([event_id])"]
          purpose: "Append-only log of attendance verification events. Each (user, event, method) tuple records once — re-scans are idempotent. Drives XP award via addXpTransaction with source='Event Attendance' and reference=event_id."
          table: "attendance_verifications"
        FriendActivity:
          fields: ["id (cuid)", "user_id", "friend_name (string — not yet FK)", "activity", "xp_change?", "created_at"]
          notes: "friend_name is a plain string for demo. getFriendUserIds() resolves it to User rows by name match."
          table: "friend_activities"
        RecentActivity:
          fields: ["id (cuid)", "user_id", "activity", "description?", "xp_earned", "created_at"]
          table: "recent_activities"
        LeaderboardEntry:
          fields: ["id (cuid)", "user_id", "name", "xp_total", "tier (Tier)", "rank", "city?", "period (Period)", "computed_at"]
          constraints: ["@@unique([user_id, period])", "@@index([period, rank])"]
          purpose: "Pre-computed leaderboards per period × city. Seed generates entries with deterministic per-period XP variance so weekly/monthly rankings differ from all-time."
          table: "leaderboard"
      enums:
        Tier: ["GENERAL", "LOYAL", "SUPERFAN", "ELITE"]
        EventCategory: ["MUSIC", "SPORTS", "THEATER", "COMEDY", "OTHER"]
        PassStatus: ["AVAILABLE", "CLAIMED", "ACTIVE", "EXPIRED"]
        Period: ["WEEKLY", "MONTHLY", "ALL_TIME"]
        PassKind: ["TICKET", "PERK", "PRESALE"]
        VerificationMethod: ["WALLET_SCAN", "SELF_CHECKIN", "MANUAL", "TICKETMASTER_WEBHOOK"]
      seed_inventory:
        path: "prisma/seed.ts"
        run: "npm run db:seed"
        users: "80 total — 1 protagonist (Alex Chen, fan_001) + 29 Los Angeles + 25 San Francisco + 25 New York. Demo cities are LA, SF, NYC (not the legacy Chicago/Toronto set)."
        leaderboard_entries: "240 — 3 periods (WEEKLY, MONTHLY, ALL_TIME) × 3 cities × ~ranked users per city. Weekly/monthly XP scaled by deterministic hash(name + period) so rankings differ from all-time."
        challenges: "8 — ch_001 Venue Explorer, ch_002 Streak Master, ch_003 Genre Hopper, ch_004 Social Butterfly, ch_005 First Timer, ch_006 Weekend Warrior, ch_007 Music Maven, ch_008 Refer a Friend"
        user_challenges: "7 rows for Alex Chen with mixed progress (33% / 40% / 67% / 86% / 100%)"
        xp_transactions: "5 rows for Alex Chen — Event Attendance 3600, Streaming 2840, Watch XP 960, Spend XP 440, Challenges 910 (sums to 8750)"
        passes: "8 — 3 owned by Alex Chen (1 ACTIVE Elite, 1 CLAIMED Elite, 1 ACTIVE Superfan) + 5 unassigned AVAILABLE offers across tier mix"
        friend_activities: "18 — 12 LA, 3 SF, 3 NYC friends acting on Alex Chen's feed"
        recent_activities: "20 entries for Alex Chen"

    source_e_listener_activity:
      owner: "Ethan"
      description: "Seed data for demo user profiles — loaded into PostgreSQL via prisma db seed"
      fields_per_record: 14
      records:
        - { name: "Alex Chen", city: "Los Angeles", artist: "Drake", tier: "Gold", xp_today: 420, engagement: 91, streak: 12, attended: true, role: "demo user" }
        - { name: "Maya Brooks", city: "Los Angeles", artist: "The Weeknd", tier: "Silver", xp_today: 260, engagement: 76, streak: 6, attended: false }
        - { name: "Jordan Lee", city: "Chicago", artist: "Drake", tier: "Platinum", xp_today: 610, engagement: 97, streak: 21, attended: true }
        - { name: "Sophia Carter", city: "New York", artist: "SZA", tier: "Gold", xp_today: 195, engagement: 68, streak: 4, attended: false }
        - { name: "Noah Patel", city: "Toronto", artist: "PARTYNEXTDOOR", tier: "Gold", xp_today: 510, engagement: 93, streak: 15, attended: true }
      notes:
        - "Alex Chen city MUST be Los Angeles (not Toronto) for leaderboard demo"
        - "Alex Chen xp_total MUST be 8,750 cumulative (not just today's 420)"

    source_f_gmail_attachment:
      owner: "Kayah"
      description: "Gmail attachment data file — contents TBD"
      action: "Download, identify fields, determine which JSON files it feeds, share field names with Luke"

    source_g_reference_datasets:
      spotify_million_playlist:
        description: "100M+ track interactions from 1M playlists (AIcrowd)"
        role: "Reference for streaming signal field structure — not loaded at runtime"
      seatdata_api:
        description: "Ticketing and venue data API with seat maps and pricing"
        role: "Future production upgrade path — Luke's Ticketmaster data covers MVP"
      datacamp_redshift:
        description: "Sample cloud database dataset"
        role: "Reference for Kayah's database hosting decision — not used tonight"

  screen_specifications:
    home:
      route: "/"
      load_function: "src/routes/+page.server.ts"
      data_sources:
        - "getUserByFanId('fan_001') + getXpBreakdown('fan_001') → fan profile with XP-by-source"
        - "getLeaderboard('WEEKLY') → top-5 leaderboard preview"
        - "getFriendActivity('fan_001', 5) → community activity feed"
        - "TicketmasterClient.searchEvents (parallel music + sports for LA) → enrichEventsWithMusicData → upcoming events. Falls back to mockEvents if Ticketmaster key missing or call fails."
      primary_components:
        - "Brand header with Zap icon + MAXESS wordmark"
        - "Time-based greeting (Good morning/afternoon/evening, Alex)"
        - "Momentum Score hero card with sparkline SVG, tier badge, XP progress bar, and weekly delta"
        - "Music / Sports Events toggle pill row — drives client-side filtering of FOR YOU cards and gates the music-only NEAR YOU THIS WEEK section"
        - "Upcoming For You horizontal card scroll, filtered to active toggle's category (music OR sports), top 4 by server order"
        - "Near You This Week — music-only vertical list of upcoming music events in user's city (LA) within next 7 days, max 5; visible only when Music toggle is active. When the user has opted into location sharing (Once or While Using) and a fresh coordinate exists, header copy reflects 'using your location'; otherwise falls back to the hardcoded LA filter."
        - "Your Ranking card with rank, percentile, city leaderboard position"
        - "Community Activity feed showing friend actions"
      required_interactions:
        - "XP progress bar animates to fill percentage on load"
        - "Event cards link to /events/[id]"
        - "Your Ranking card links to /score"
        - "Community Activity shows friend names with action descriptions"
        - "Music/Sports toggle change re-filters FOR YOU cards and shows/hides NEAR YOU THIS WEEK section"
        - "NEAR YOU THIS WEEK rows link to /events/[id]; shows empty state copy when no qualifying events exist"
      after_data_layer: "Real fan score (8,750 XP), real Elite tier badge, real 12-day streak, server-side data from PostgreSQL, community activity from friend_activities, upcoming events from Ticketmaster (LA music + sports) enriched with user's top artists"

    events:
      route: "/events"
      load_function: "src/routes/events/+page.server.ts"
      data_sources:
        - "Reads url.searchParams: category (default 'all'), city (default 'Los Angeles')"
        - "TicketmasterClient.searchEvents → normalizeTicketmasterEvent → enrichEventsWithMusicData(userArtists) → events list"
        - "getUserByFanId('fan_001') → resolves lastfm_username → getUserTopArtists() for music intelligence"
        - "First event marked featured + trending"
        - "Falls back to mockEvents if Ticketmaster key missing"
      primary_components:
        - "Filter chips for category (music/sports/comedy)"
        - "Search bar with real-time filtering"
        - "Event cards with image, venue, date, presale indicators"
        - "Bookmark toggles with state persistence"
        - "Featured hero card for top event"
        - "Genre tag chips"
      required_interactions:
        - "Filter chips update displayed events in real time"
        - "Search query filters events as user types"
        - "Bookmark toggle persists during session"
        - "Notify Me button state management"
        - "Event card tap → /events/[id]"
      category_chips:
        music: "MUSIC ACCESS — orange"
        sports: "SPORTS ACCESS — orange"

    event_detail:
      route: "/events/[id]"
      load_function: "src/routes/events/[id]/+page.server.ts"
      data_sources:
        - "Looks up id in mockEvents first"
        - "If id starts with 'tm_' and not found locally, calls TicketmasterClient.getEvent(tmId) and normalizes"
        - "Recommended events: same category, excluding current, up to 3 picks from mockEvents"
        - "mockFansAttending + fansAttendingCount for social proof"
      throws_404: "if event not found in either mock data or Ticketmaster"

    score:
      route: "/score"
      nav_label: "Score"
      load_function: "src/routes/score/+page.server.ts"
      data_sources:
        - "getUserByFanId('fan_001') + getXpBreakdown('fan_001') → fan profile with XP-by-source"
        - "getAllLeaderboardEntries() (all periods × all cities) → mapped through transformLeaderboardEntry with viewer id and friend ids"
        - "getFriendUserIds('fan_001') → enables is_friend flagging on leaderboard rows"
        - "getUserChallenges('fan_001') → challenge cards with task checklists and progress"
        - "getFriendActivity('fan_001', 15) → community feed"
        - "getXpHistory('fan_001', 14) → 14-day daily XP series for sparkline (gaps filled with 0)"
      primary_components:
        - "Superfan score summary card (score, Elite badge, weekly delta, rank in city, percentile)"
        - "14-day XP history sparkline"
        - "Community leaderboard with city / time period filters, current user row highlighted orange, friend-only toggle"
        - "Friend activity horizontal scroll"
        - "Challenges with task checklists, progress bars, and Limited badges (mapped from difficulty=Hard)"
      required_interactions:
        - "City filter updates displayed rankings"
        - "Time period filter (Weekly / Monthly / All time) changes data slice"
        - "Current user row highlighted in orange via is_me flag"
        - "Friend filter toggle filters leaderboard to is_friend=true rows"

    access:
      route: "/access"
      nav_label: "Access"
      load_function: "src/routes/access/+page.server.ts"
      data_sources:
        - "getUserByFanId('fan_001')"
        - "getUserPasses('fan_001') → owned passes"
        - "getFeaturedOffers(5) → available/unassigned passes for featured cards"
        - "Static topArtists list (3 entries: The Weeknd, Anaheim Ducks, Kaytranada) with per-artist tier progress"
