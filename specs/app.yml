      performance: "Smooth animations and responsive interactions"

    team_success_statement: "Maxxes ships 5 primary screens plus detail views, backed by 80 seeded users across LA/SF/NYC with 240 leaderboard rows, 8 challenges, 8 passes, an XP transaction ledger driving real breakdowns and 14-day history, and a live Vercel URL anyone can open. The app is understandable without a presenter."

  browser_support:
    primary:
      - "Chrome 90+"
      - "Firefox 88+"
      - "Safari 14+"
      - "Edge 90+"
    mobile:
      - "iOS Safari"
      - "Chrome Mobile"

  file_structure:
    project_root:
      - "package.json (npm scripts: dev, build, db:generate, db:push, db:migrate, db:seed, db:studio, db:reset)"
      - "svelte.config.js (adapter-vercel)"
      - "vite.config.js"
      - "tsconfig.json / jsconfig.json"
      - "prisma.config.ts"
      - "prisma/schema.prisma"
      - "prisma/seed.ts"

    source_structure: |
      src/
      ├── app.html
      ├── routes/
      │   ├── +layout.svelte (BottomNav + NotificationPanel)
      │   ├── +layout.ts
      │   ├── +page.svelte (Home)
      │   ├── +page.server.ts (fan + leaderboard preview + friend activity + Ticketmaster music/sports)
      │   ├── events/
      │   │   ├── +page.svelte
      │   │   ├── +page.server.ts (Ticketmaster search → normalize → music enrichment)
      │   │   └── [id]/
      │   │       ├── +page.svelte
      │   │       └── +page.server.ts (mockEvents lookup, Ticketmaster fallback for tm_* ids)
      │   ├── score/
      │   │   ├── +page.svelte
      │   │   └── +page.server.ts (fan + xp breakdown + xp history + leaderboard + challenges + friend activity)
      │   ├── access/
      │   │   ├── +page.svelte
      │   │   └── +page.server.ts (fan + owned passes + featured offers + top artists)
      │   ├── passes/[id]/
      │   │   ├── +page.svelte
      │   │   └── +page.server.ts (getPassByPassId)
      │   ├── artist/[id]/
      │   │   ├── +page.svelte
      │   │   └── +page.server.ts
      │   ├── profile/
      │   │   ├── +page.svelte
      │   │   └── +page.server.ts (fan + xp breakdown + per-artist tier mock)
      │   ├── admin/
      │   │   └── scan/
      │   │       ├── +page.svelte (demo simulate-scan UI)
      │   │       └── +page.server.ts (lists Alex's TICKET passes)
      │   └── api/
      │       ├── events/+server.ts (search endpoint)
      │       └── passes/
      │           ├── [passId]/wallet/+server.ts (.pkpass download)
      │           └── scan/[serial]/+server.ts (attendance scan ingest)
      ├── lib/
      │   ├── api/
      │   │   ├── base.ts (BaseApiClient with rate limiting, SimpleCache)
      │   │   ├── ticketmaster.ts (TicketmasterClient)
      │   │   ├── spotify.ts (SpotifyClient — Client Credentials)
      │   │   └── lastfm.ts (LastFmClient)
      │   ├── components/
      │   │   ├── BottomNav.svelte
      │   │   ├── NotificationPanel.svelte
      │   │   ├── UpcomingEvents.svelte
      │   │   └── (other shared components)
      │   ├── config/
      │   │   └── env.ts (serverConfig + publicConfig)
      │   ├── domain/
      │   │   ├── types.ts (Fan, Event, LeaderboardEntry, Challenge, Pass, FriendActivity, RecentActivity, TicketmasterEvent)
      │   │   ├── hotlist.ts
      │   │   └── xp.ts (classifyTier + tier math)
      │   ├── server/
      │   │   ├── database.ts (Prisma singleton + 20+ query helpers + calculateTier + recordAttendanceVerification)
      │   │   ├── transforms.ts (Prisma row → UI domain type mappers + getTierPerks)
      │   │   ├── events.ts (Ticketmaster → Event normalizer + filterNearYouThisWeek helper)
      │   │   ├── music.ts (Spotify-first / Last.fm-fallback intelligence service)
      │   │   └── wallet/
      │   │       └── pkpass.ts (Apple Wallet .pkpass generator + pluggable signer)
      │   ├── stores/
      │   ├── styles/
      │   │   ├── tokens.css
      │   │   └── app.css
      │   └── data/
      │       └── mockData.ts (mockEvents, mockFansAttending — Ticketmaster fallback)
      ├── static/
      │   └── data/ (legacy JSON files — deprecated, see legacy_static_json_files)
      └── prisma/
          ├── schema.prisma
          └── seed.ts

  validation_requirements:
    before_deployment:
      - "All 5 primary tabs (Home, Events, Score, Access, Profile) load successfully"
      - "Event/artist/pass detail screens load and handle missing ids with 404"
      - "Bottom navigation highlights the active tab via first-segment match"
      - "All animations work as specified"
      - "Prisma client connects via DATABASE_URL; seed populates 80 users / 240 leaderboard entries / 8 challenges / 8 passes"
      - "Ticketmaster fallback to mockEvents works when key is missing"
      - "Mobile responsive design verified"
      - "Cross-browser compatibility tested"
      - "Performance targets met"
      - "Alex Chen data consistent across all screens"

  roadmap:
    description: "Features deferred from the demo prototype, earmarked for future development."

    auth:
      status: "DEFERRED — earmarked for roadmap"
      current_state: "Demo prototype uses hardcoded fan_id 'fan_001' (Alex Chen). No login, no session, no user switching."
      planned_provider: "Auth0 (config stubs already exist in src/lib/config/env.ts)"
      implementation_notes:
        - "Auth0 domain, client ID, and client secret are already structured in serverConfig and publicConfig"
        - "User model in Prisma schema already has auth0-compatible fields"
        - "When implemented: replace hardcoded fan_001 with authenticated user ID in all server load functions"
      unlocks:
        - "Spotify Authorization Code + PKCE flow for user-specific listening data (top artists, recently played)"
        - "Multi-user support with real logins"
        - "Personalized event recommendations based on actual listening history"
        - "User-to-user social features (friend graph, activity feed)"
        - "Persistent bookmarks and notification preferences"
      priority: "P1 — first feature after demo launch"

    apple_music:
      status: "EXCLUDED by product decision"
      notes: "MusicKit integration code exists as mock only (src/lib/stores/appleMusic.ts, src/lib/data/mockMusicKit.ts). No real API calls. Re-evaluate if Apple Music becomes strategically important."

    discord_community:
      status: "DEFERRED"
      notes: "Config stubs and Zod types exist. Not needed for demo prototype."
      priority: "P2"

    real_time_features:
      status: "DEFERRED"
      items:
        - "WebSocket leaderboard updates"
        - "Push notifications (requires auth + device registration)"
        - "Live event check-in trust module"
      priority: "P3"

    partner_features:
      status: "DEFERRED"
      items:
        - "Venue POS integration"
        - "Partner dashboard (B2B)"
        - "Sponsor ROI dashboards"
        - "Predictive churn modeling"
      priority: "P3"
