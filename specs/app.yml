  wallet_attendance:
    description: "Apple Wallet-backed attendance verification. A ticket-kind Pass owned by a user can be added to Apple Wallet as a signed (or in dev: unsigned) .pkpass. The pass embeds a QR/barcode whose payload is its apple_wallet_serial. When that serial is scanned at the venue, the scanner hits /api/passes/scan/[serial], which records an AttendanceVerification row and awards XP via the existing xp_transactions ledger."
    components:
      generator:
        path: "src/lib/server/wallet/pkpass.ts"
        purpose: "Build a .pkpass bundle (pass.json + manifest.json + signature) for a given Pass row. Pluggable signer interface: unsigned in dev (no Apple cert), real-signed when APPLE_PASS_CERT_P12_BASE64 + APPLE_PASS_CERT_PASSWORD are present."
        deps: ["jszip for the .pkpass zip container"]
      endpoints:
        wallet_download:
          route: "GET /api/passes/[passId]/wallet"
          response: "200 application/vnd.apple.pkpass with the generated bundle; 404 if pass not found; 400 if pass is not user-owned or lacks an apple_wallet_serial"
          side_effects: "Stamps pass.wallet_added_at on first download"
        scan_ingest:
          route: "GET|POST /api/passes/scan/[serial]"
          purpose: "Record a venue scan against the pass identified by apple_wallet_serial"
          methods:
            GET: "Confirmation page-style HTML redirect — used when a phone camera opens the QR. Records the scan then 302s to /events/[event_id]?scanned=1"
            POST: "JSON API for venue scanner integrations. Returns { status: 'ok'|'duplicate'|'not_found', xp_awarded, attendance_id }"
          idempotency: "AttendanceVerification has @@unique([user_id, event_id, method]) — re-scans of the same pass return status='duplicate' and no additional XP is awarded"
    verification_xp:
      WALLET_SCAN: { xp: 200, confidence: 90, source: "Event Attendance" }
      SELF_CHECKIN: { xp: 50, confidence: 30, source: "Event Attendance" }
      MANUAL: { xp: 100, confidence: 70, source: "Event Attendance" }
      TICKETMASTER_WEBHOOK: { xp: 200, confidence: 95, source: "Event Attendance" }
      notes: "XP amounts align with xp_scoring_model.eventAttended (200) and concertCheckIns (50)."
    signing_modes:
      unsigned_default: "When any of APPLE_PASS_TYPE_ID / APPLE_TEAM_ID / APPLE_PASS_CERT_P12_BASE64 / APPLE_PASS_CERT_PASSWORD is missing, the generator emits a valid .pkpass zip with pass.json + manifest.json but no signature.bin. iOS will refuse to add it but the download flow, scan endpoint, attendance ledger, and XP wiring are fully exercised."
      signed: "When all four env vars are set, generator inserts a PKCS#7 detached signature of manifest.json under Apple's WWDR cert chain. Implementation slot present; full PKCS#7 path is a follow-up (current ship: unsigned-only)."

  xp_scoring_model:
    description: "Signal-based XP calculation from listener activity data"
    signals:
      - { field: "minutesListened", rule: "+3 XP per hour", calculation: "(minutesListened / 60) × 3", example: "173 min → 8.6 XP" }
      - { field: "eventAttended", rule: "+200 XP per verified attendance", calculation: "if true → +200 XP", example: "true → +200 XP" }
      - { field: "concertCheckIns", rule: "In-venue engagement signal", calculation: "concertCheckIns × 50", example: "1 check-in → +50 XP" }
      - { field: "playlistSaves", rule: "Music engagement depth", calculation: "playlistSaves × 5", example: "12 saves → +60 XP" }
      - { field: "setlistSongsPlayed", rule: "Setlist engagement", calculation: "setlistSongsPlayed × 3", example: "9 songs → +27 XP" }
      - { field: "streakDays", rule: "Streak multiplier 1.0x–2.0x", calculation: "0–7 days: 1.0x | 8–14: 1.3x | 15–28: 1.5x | 28+: 2.0x", example: "12 days → 1.3x" }
      - { field: "engagementScore", rule: "Composite signal for leaderboard sort", calculation: "Use directly as score proxy 0–100", example: "91 → rank signal" }
      - { field: "xpEarnedToday", rule: "Today's XP adds to cumulative total", calculation: "xp_total + xpEarnedToday", example: "420 today → adds to 8,750 total" }

