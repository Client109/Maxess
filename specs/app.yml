  deployment:
    build_target: "Serverless functions via @sveltejs/adapter-vercel (required for server routes, API proxying, and database access)"
    hosting_platform: "Vercel"
    deployment_method: "Automatic deployment from GitHub main branch"
    database: "Any PostgreSQL reachable via DATABASE_URL — typically Vercel Postgres / Neon in prod, local Prisma dev server (postgres://localhost:51214/template1) in dev"
    public_url_required: "Yes — must be accessible without installation"

    environment_variables:
      DATABASE_URL: "PostgreSQL connection string consumed by src/lib/server/database.ts via $env/dynamic/private; defaults to local Prisma dev server when unset"
      TICKETMASTER_API_KEY: "From developer.ticketmaster.com (optional — falls back to mockEvents if missing)"
      SPOTIFY_CLIENT_ID: "From developer.spotify.com (optional — music enrichment degrades gracefully)"
      SPOTIFY_CLIENT_SECRET: "From developer.spotify.com (optional)"
      LASTFM_API_KEY: "From last.fm/api (optional — fallback to seeded top-artist list)"
      PUBLIC_APP_URL: "Public base URL for generated pass webServiceURL / barcode payloads (e.g. https://maxess-test.vercel.app). Used by the .pkpass generator so scan QRs resolve to the deployed scan endpoint."
      APPLE_PASS_TYPE_ID: "Apple Pass Type Identifier (e.g. pass.com.maxxes.eventticket). Optional — without it the generator emits an unsigned .pkpass that demos the flow but cannot be added to a real iPhone."
      APPLE_TEAM_ID: "Apple Developer Team ID. Optional, paired with APPLE_PASS_TYPE_ID."
      APPLE_PASS_CERT_P12_BASE64: "Base64-encoded signing certificate (.p12). Optional — required for real-device-installable passes."
      APPLE_PASS_CERT_PASSWORD: "Password for the .p12 cert. Optional, paired with APPLE_PASS_CERT_P12_BASE64."
      APPLE_PASS_ORGANIZATION_NAME: "Organization name shown in Wallet UI (default 'Maxxes')."

    build_process:
      1: "package.json postinstall runs `prisma generate` automatically"
      2: "build script: `prisma generate && svelte-kit sync && vite build`"
      3: "Provision PostgreSQL, run `prisma migrate deploy` then `npm run db:seed`"
      4: "Set DATABASE_URL + optional API keys in Vercel dashboard"
      5: "Push to main → Vercel auto-deploys"
      6: "Confirm build succeeds and URL is generated"
      7: "Verify all five tabs load with live data"
    fallback: "If Ticketmaster/Spotify/Last.fm keys not configured, routes fall back to mockEvents (src/lib/data/mockData.ts) and seeded top-artist list. Database connection is required — there is no DB fallback."

    performance_targets:
      lighthouse_score: "90+ in all categories"
      first_contentful_paint: "< 2 seconds"
      time_to_interactive: "< 3 seconds"
      bundle_size: "< 200KB initial JavaScript"

